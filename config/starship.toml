# Warning: This config does not include keys that have an unset value

# $all is shorthand for $username$hostname$localip$shlvl$singularity$kubernetes$nats$directory$vcsh$fossil_branch$fossil_metrics$git_branch$git_commit$git_state$git_metrics$git_status$hg_branch$hg_state$pijul_channel$docker_context$package$bun$c$cmake$cobol$cpp$daml$dart$deno$dotnet$elixir$elm$erlang$fennel$fortran$gleam$golang$gradle$haskell$haxe$helm$java$julia$kotlin$lua$mojo$nim$nodejs$ocaml$odin$opa$perl$php$pulumi$purescript$python$quarto$raku$rlang$red$ruby$rust$scala$solidity$swift$terraform$typst$vlang$vagrant$xmake$zig$buf$guix_shell$nix_shell$conda$pixi$meson$spack$memory_usage$aws$gcloud$openstack$azure$direnv$env_var$mise$crystal$custom$sudo$cmd_duration$line_break$jobs$battery$time$status$container$netns$os$shell$character
"$schema" = "https://starship.rs/config-schema.json"
add_newline = false
format = """$localip$os$shell$username$directory$sudo$character$git_branch$git_commit$git_state$git_metrics$git_status"""
right_format = """$all"""
continuation_prompt = "[∙](bright-black) "
scan_timeout = 30
command_timeout = 500
follow_symlinks = true

[palettes]

[profiles]
[character]
format = "$symbol "
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_visual_symbol = "[❮](bold yellow)"
vimcmd_replace_symbol = "[❮](bold purple)"
vimcmd_replace_one_symbol = "[❮](bold purple)"
disabled = false

[os]
format = "[$symbol]($style)"
style = "bold white"
disabled = true

[os.symbols]
Alpaquita = " "
Alpine = " "
AlmaLinux = " "
Amazon = " "
Android = " "
AOSC = " "
Arch = " "
Artix = " "
CachyOS = " "
CentOS = " "
Debian = " "
DragonFly = " "
Elementary = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = "󰛓 "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = "󰈸 "
Ios = "󰀷 "
Kali = " "
Linux = " "
Mabox = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
Nobara = " "
OpenBSD = "󰈺 "
openSUSE = " "
OracleLinux = "󰌷 "
Pop = " "
Raspbian = " "
Redhat = " "
RedHatEnterprise = " "
RockyLinux = " "
Redox = "󰀘 "
Solus = "󰠳 "
SUSE = " "
Ubuntu = " "
Unknown = " "
Void = " "
Windows = "󰍲 "
Zorin = " "

[username]
detect_env_vars = []
format = "[$user]($style) "
style_root = "red bold"
style_user = "yellow bold"
show_always = false
disabled = false

[username.aliases]


[hostname]
ssh_only = true
# ssh_symbol = "🌐 "
ssh_symbol = " "
trim_at = "."
detect_env_vars = []
format = "[$ssh_symbol$hostname]($style) "
style = "green dimmed bold"
disabled = false

[hostname.aliases]
[localip]
ssh_only = true
format = "[$localipv4]($style) "
style = "yellow bold"
disabled = false

[shlvl]
threshold = 2
format = "[$symbol$shlvl]($style) "
# symbol = "↕️  "
symbol = " "
repeat = false
repeat_offset = 0
style = "bold yellow"
disabled = true

[shell]
format = "[$indicator]($style) "
bash_indicator = "bsh"
fish_indicator = "fsh"
zsh_indicator = "zsh"
powershell_indicator = "psh"
ion_indicator = "ion"
elvish_indicator = "esh"
tcsh_indicator = "tsh"
nu_indicator = "nu"
xonsh_indicator = "xsh"
cmd_indicator = "cmd"
unknown_indicator = ""
style = "white bold"
disabled = true

[sudo]
format = "[$symbol ]($style)"
# symbol = "🧙 "
symbol = " "
style = "bold blue"
allow_windows = false
disabled = false

[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "
symbol = " "
# symbol = " "
style = "bold purple"
truncation_length = 9223372036854775807
truncation_symbol = "…"
only_attached = false
always_show_remote = false
ignore_branches = ["main", "master"]
ignore_bare_repo = false
disabled = false

[git_commit]
commit_hash_length = 7
format = '[\($hash$tag\)]($style) '
style = "green bold"
only_detached = true
disabled = false
# tag_symbol = " 🏷  "
tag_symbol = '  '
tag_disabled = true
tag_max_candidates = 0

[git_state]
rebase = "REBASING"
merge = "MERGING"
revert = "REVERTING"
cherry_pick = "CHERRY-PICKING"
bisect = "BISECTING"
am = "AM"
am_or_rebase = "AM/REBASE"
style = "bold yellow"
format = '\([$state( $progress_current/$progress_total)]($style)\) '
disabled = false

[git_metrics]
added_style = "bold green"
deleted_style = "bold red"
only_nonzero_diffs = true
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"
disabled = true
ignore_submodules = false

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "red bold"
stashed = '\$'
ahead = "⇡"
behind = "⇣"
up_to_date = ""
diverged = "⇕"
conflicted = "="
deleted = "✘"
renamed = "»"
modified = "!"
staged = "+"
untracked = "?"
typechanged = ""
ignore_submodules = false
disabled = false
use_git_executable = false

[fill]
# style = "bold black"
symbol = " "
disabled = false

[time]
format = "at [$time]($style) "
style = "bold yellow"
use_12hr = false
disabled = true
utc_time_offset = "local"
time_range = "-"

[status]
format = "[$symbol$status]($style) "
# symbol = "❌"
symbol = " "
success_symbol = ""
# not_executable_symbol = "🚫"
not_executable_symbol = "󰜺 "
# not_found_symbol = "🔍"
not_found_symbol = "󰦀 "
# sigint_symbol = "🧱"
sigint_symbol = "󱊑 "
signal_symbol = "⚡"
style = "bold red"
map_symbol = false
recognize_signal_code = true
pipestatus = false
pipestatus_separator = "|"
pipestatus_format = '\[$pipestatus\] => [$symbol$common_meaning$signal_name$maybe_int]($style) '
disabled = false

[nodejs]
format = "[$symbol($version )]($style)"
version_format = "${raw}"
symbol = " "
# symbol = " "
style = "bold green"
disabled = false
not_capable_style = "bold red"
detect_extensions = ["js", "mjs", "cjs", "ts", "mts", "cts"]
detect_files = [
  "package.json",
  ".node-version",
  ".nvmrc",
  "!bunfig.toml",
  "!bun.lock",
  "!bun.lockb",
]
detect_folders = ["node_modules"]

[jobs]
threshold = 1
symbol_threshold = 1
number_threshold = 2
format = "[$symbol$number]($style) "
symbol = "✦"
style = "bold blue"
disabled = false

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰁽 "
empty_symbol = "󰂎 "
disabled = false
format = "[$symbol$percentage]($style) "
[[battery.display]]
threshold = 15
style = "red bold"

[package]
format = "is [$symbol$version]($style) "
symbol = "󰏗 "
# symbol = "📦 "
style = "208 bold"
display_private = false
disabled = false
version_format = "v${raw}"

[python]
pyenv_version_name = true
pyenv_prefix = "pyenv "
# python_binary = [["python"], ["python3"], ["python2"]]
format = ' [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
version_format = "v${raw}"
style = "yellow bold"
# symbol = "🐍 "
symbol = " "
disabled = false
detect_extensions = ["py", "ipynb"]
detect_files = [
  "requirements.txt",
  ".python-version",
  "pyproject.toml",
  "Pipfile",
  "tox.ini",
  "setup.py",
  "__init__.py",
]
detect_folders = []
detect_env_vars = ["VIRTUAL_ENV"]

[direnv]
format = "[$symbol$loaded/$allowed]($style) "
# symbol = "direnv "
symbol = ""
style = "bold bright-yellow"
disabled = false
detect_extensions = []
detect_env_vars = ["DIRENV_FILE"]
detect_files = [".envrc"]
detect_folders = []
allowed_msg = ""
not_allowed_msg = "not allowed"
denied_msg = "denied"
loaded_msg = ""
unloaded_msg = "not loaded"


[memory_usage]
threshold = 67
format = " $symbol[$ram( | $swap)]($style) "
style = "white bold dimmed"
# symbol = "🐏 "
symbol = " "
disabled = false

[c]
format = " [$symbol($version(-$name) )]($style)"
version_format = "v${raw}"
style = "149 bold"
symbol = " "
disabled = false
detect_extensions = ["c", "h"]
detect_files = []
detect_folders = []
commands = [["cc", "--version"], ["gcc", "--version"], ["clang", "--version"]]

[cmake]
format = " [$symbol($version )]($style)"
version_format = "v${raw}"
symbol = " "
style = "bold blue"
disabled = false
detect_extensions = []
detect_files = ["CMakeLists.txt", "CMakeCache.txt"]
detect_folders = []

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
style = "yellow bold"
show_milliseconds = false
disabled = false
show_notifications = false
min_time_to_notify = 45000

[conda]
truncation_length = 1
format = " [$symbol$environment]($style) "
symbol = " "
style = "green bold"
ignore_base = true
detect_env_vars = ["!PIXI_ENVIRONMENT_NAME"]
disabled = false

[cpp]
format = " [$symbol($version(-$name) )]($style)"
version_format = "v${raw}"
style = "149 bold"
symbol = " "
disabled = true
detect_extensions = [
  "cpp",
  "cc",
  "cxx",
  "c++",
  "hpp",
  "hh",
  "hxx",
  "h++",
  "tcc",
]
detect_files = []
detect_folders = []
commands = [
  [
    "c++",
    "--version",
  ],
  [
    "g++",
    "--version",
  ],
  [
    "clang++",
    "--version",
  ],
]
[env_var]


[gcloud]
format = ' [$symbol$account(@$domain)(\($region\))]($style) '
symbol = " "
style = "bold blue"
disabled = false
detect_env_vars = []

[gcloud.region_aliases]

[gcloud.project_aliases]

[gradle]
format = " [$symbol($version )]($style)"
version_format = "v${raw}"
# symbol = "🅶 "
symbol = " "
style = "bold bright-cyan"
disabled = false
recursive = false
detect_extensions = ["gradle", "gradle.kts"]
detect_files = []
detect_folders = ["gradle"]

[line_break]
disabled = true

[lua]
format = " [$symbol($version )]($style)"
version_format = "v${raw}"
symbol = " "
style = "bold blue"
lua_binary = "lua"
disabled = false
detect_extensions = ["lua"]
detect_files = [".lua-version"]
detect_folders = ["lua"]

[meson]
truncation_length = 4294967295
truncation_symbol = "…"
format = " [$symbol$project]($style) "
# symbol = "⬢ "
symbol = "󰔷 "
style = "blue bold"
disabled = false

[netns]
format = '[$symbol \[$name\]]($style) '
# symbol = "🛜"
symbol = "󰖩 "
style = "blue bold dimmed"
disabled = true

[nix_shell]
format = ' [$symbol$state( \($name\))]($style) '
symbol = " "
# symbol = "❄️  "
style = "bold blue"
impure_msg = "impure"
pure_msg = "pure"
unknown_msg = ""
disabled = true
heuristic = false

[rust]
format = " [$symbol($version )]($style)"
version_format = "v${raw}"
# symbol = "🦀 "
symbol = "󱘗 "
style = "bold red"
disabled = false
detect_extensions = ["rs"]
detect_files = ["Cargo.toml"]
detect_folders = []

[custom]
