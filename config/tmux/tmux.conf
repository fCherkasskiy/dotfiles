set -g mouse on
set -g set-clipboard on

set -s escape-time 0
set-option -g xterm-keys on
set -g terminal-overrides 'xterm*:smcup@:rmcup@'

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

bind -n M-C-h     select-pane -L
bind -n M-C-l     select-pane -R
bind -n M-C-k     select-pane -U
bind -n M-C-j     select-pane -D

bind -n M-p last-window
bind -n M-n next-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

# bind -n C-Tab next-window
# bind -n C-S-Tab previous-window
# Undercurl
set -g default-terminal "${TERM}"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "basic"

# Load catppuccin
run $XDG_CONFIG_HOME/tmux/plugins/tmux/catppuccin.tmux
# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
# set -agF status-right "#{E:@catppuccin_status_ram}"
# set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_battery}"
# set -agF status-right "#{E:@catppuccin_status_weather}"
# set -agF status-right "#{E:@catppuccin_status_clima}"
# set -ag status-right "#{E:@catppuccin_status_uptime}"
# set -g status-right "#{pomodoro_status}"
set -agF status-right "#{E:@catppuccin_status_pomodoro_plus}"
set -g @pomodoro_on " "
set -g @pomodoro_complete "✔︎ "                 # The formatted output when the break is running
set -g @pomodoro_pause "⏸︎ "                    # The formatted output when the Pomodoro/break is paused
set -g @pomodoro_prompt_break "⏲︎ break? "      # The formatted output when waiting to start a break
set -g @pomodoro_prompt_pomodoro "⏱︎ start? "   # The formatted output when waiting to start a Pomodoro
set -g @pomodoro_notifications 'on'           # Enable desktop notifications from your terminal
set -g @pomodoro_granularity 'on'             # Enables MM:SS (ex: 00:10) format instead of the default (ex: 1m)
set -g @pomodoro_intervals 4                   # The number of intervals before a longer break is started

# List of plugins
set -g @plugin 'noscript/tmux-mighty-scroll'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'sainnhe/tmux-fzf'

set -g @plugin 'olimorris/tmux-pomodoro-plus'
# set -g @plugin ''
set -g @plugin 'catppuccin/tmux'
# set -g @plugin "janoamaral/tokyo-night-tmux"
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
# set -g @plugin 'vascomfnunes/tmux-clima'
# set -g @plugin 'ilya-manin/tmux-weather'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

if "test ! -d $XDG_CONFIG_HOME/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm $XDG_CONFIG_HOME/tmux/plugins/tpm && $XDG_CONFIG_HOME/tmux/plugins/tpm/bin/install_plugins'"
run '$XDG_CONFIG_HOME/tmux/plugins/tpm/tpm'
